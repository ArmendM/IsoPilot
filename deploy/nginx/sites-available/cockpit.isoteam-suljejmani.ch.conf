upstream isopilot_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen      80;
    listen      [::]:80;
    server_name cockpit.isoteam-suljejmani.ch;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name cockpit.isoteam-suljejmani.ch;

    ssl_certificate         /etc/letsencrypt/live/cockpit.isoteam-suljejmani.ch/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/cockpit.isoteam-suljejmani.ch/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cockpit.isoteam-suljejmani.ch/chain.pem;
    include                 /etc/nginx/snippets/tls.conf;

    access_log /var/log/nginx/isopilot.access.log;
    error_log  /var/log/nginx/isopilot.error.log warn;

    client_max_body_size 2m;
    client_body_timeout  20s;
    limit_conn perip 20;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Anmeldung streng begrenzen
    location ^~ /api/auth/ {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    # Cron nur vom Server selbst
    location ^~ /api/cron/ {
        allow 127.0.0.1; allow ::1; deny all;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    # Statische Dateien tragen einen Hash im Namen
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    location ^~ /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    location ~ /\. { deny all; }
}
