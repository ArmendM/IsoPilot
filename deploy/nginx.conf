# ═══════════════════════════════════════════════════════════
# /etc/nginx/nginx.conf  — nur die relevanten Ergänzungen im http-Block
# ═══════════════════════════════════════════════════════════

http {
    # Rate-Limit-Zonen. Getrennt, damit ein Angriff auf die Anmeldung
    # nicht die normale Nutzung ausbremst.
    limit_req_zone $binary_remote_addr zone=login:10m  rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=600r/m;
    limit_req_status 429;

    # Gleichzeitige Verbindungen pro IP begrenzen
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Version verbergen
    server_tokens off;

    # Auslagerung bei grösseren Antworten vermeiden
    proxy_buffering       on;
    proxy_buffers         16 16k;
    proxy_busy_buffers_size 32k;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml image/svg+xml;

    log_format isopilot escape=json '{'
        '"time":"$time_iso8601",'
        '"ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"ua":"$http_user_agent"'
    '}';
}

# ═══════════════════════════════════════════════════════════
# /etc/nginx/sites-available/isopilot.ch
# ═══════════════════════════════════════════════════════════

upstream isopilot_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP: nur Weiterleitung und ACME ───────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name isopilot.ch www.isopilot.ch;

    # certbot legt hier seine Challenge-Dateien ab
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://isopilot.ch$request_uri;
    }
}

# ── www auf die Hauptdomain umleiten ───────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name www.isopilot.ch;

    ssl_certificate     /etc/letsencrypt/live/isopilot.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isopilot.ch/privkey.pem;
    include             /etc/nginx/snippets/tls.conf;

    return 301 https://isopilot.ch$request_uri;
}

# ── Die eigentliche Anwendung ──────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name isopilot.ch;

    ssl_certificate         /etc/letsencrypt/live/isopilot.ch/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/isopilot.ch/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/isopilot.ch/chain.pem;
    include                 /etc/nginx/snippets/tls.conf;

    access_log /var/log/nginx/isopilot.access.log isopilot;
    error_log  /var/log/nginx/isopilot.error.log warn;

    # Logo-Uploads: 2 MB reichen, alles darüber ist ein Fehler oder ein Angriff
    client_max_body_size 2m;
    client_body_timeout  20s;

    limit_conn perip 20;

    # Sicherheits-Header. add_header gilt nur im innersten Block, in dem es
    # steht, deshalb per Snippet in jedem location-Block eingebunden.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Anmeldung: streng begrenzt ─────────────────────────
    location ^~ /api/auth/ {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    # ── Cron-Endpunkte: nur vom Server selbst ──────────────
    location ^~ /api/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    # ── Statische Next.js-Dateien: lange cachen ────────────
    # Die Dateinamen enthalten einen Hash, deshalb ist immutable korrekt.
    location /_next/static/ {
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    location /favicon.ico { access_log off; proxy_pass http://isopilot_app; }

    # ── Übrige API ─────────────────────────────────────────
    location ^~ /api/ {
        limit_req zone=api burst=30 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    # ── Alles Übrige ───────────────────────────────────────
    location / {
        limit_req zone=general burst=60 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://isopilot_app;
    }

    # Versteckte Dateien blocken
    location ~ /\. { deny all; }
}

# ═══════════════════════════════════════════════════════════
# /etc/nginx/snippets/proxy.conf
# ═══════════════════════════════════════════════════════════

proxy_http_version 1.1;
proxy_set_header   Connection        "";
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_set_header   X-Forwarded-Host  $host;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Für Server-Sent Events oder WebSockets, falls später nötig
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# ═══════════════════════════════════════════════════════════
# /etc/nginx/snippets/security-headers.conf
# ═══════════════════════════════════════════════════════════

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff"                              always;
add_header X-Frame-Options           "DENY"                                 always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;

# CSP: Next.js braucht im Produktionsmodus kein unsafe-eval.
# 'unsafe-inline' für Styles bleibt nötig, solange Inline-Styles im Einsatz sind.
add_header Content-Security-Policy "default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: blob:; \
font-src 'self'; \
connect-src 'self'; \
frame-ancestors 'none'; \
base-uri 'self'; \
form-action 'self'" always;

# ═══════════════════════════════════════════════════════════
# /etc/nginx/snippets/tls.conf
# Mozilla-Profil "intermediate"
# ═══════════════════════════════════════════════════════════

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_timeout       1d;
ssl_session_cache         shared:SSL:10m;
ssl_session_tickets       off;
ssl_stapling              on;
ssl_stapling_verify       on;
resolver                  9.9.9.9 149.112.112.112 valid=300s;
resolver_timeout          5s;

# ═══════════════════════════════════════════════════════════
# /etc/nginx/conf.d/upgrade-map.conf
# Nötig für die Connection-Upgrade-Zeile im Proxy-Snippet
# ═══════════════════════════════════════════════════════════

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ═══════════════════════════════════════════════════════════
# Einrichtung auf Debian 13
# ═══════════════════════════════════════════════════════════
#
# apt install nginx certbot python3-certbot-nginx
# mkdir -p /var/www/certbot
#
# # Zertifikat holen, webroot statt Plugin: nginx bleibt unangetastet
# certbot certonly --webroot -w /var/www/certbot \
#   -d isopilot.ch -d www.isopilot.ch \
#   --email daut@isoteam.ch --agree-tos --no-eff-email
#
# ln -s /etc/nginx/sites-available/isopilot.ch /etc/nginx/sites-enabled/
# rm /etc/nginx/sites-enabled/default
# nginx -t && systemctl reload nginx
#
# # Erneuerung: certbot bringt einen systemd-Timer mit. Nur der Reload fehlt:
# mkdir -p /etc/letsencrypt/renewal-hooks/deploy
# printf '#!/bin/sh\nsystemctl reload nginx\n' \
#   > /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
# chmod +x /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
#
# # Erneuerung testen, ohne etwas zu verändern:
# certbot renew --dry-run
#
# # Firewall
# ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp && ufw enable
#
# # In next.config.ts, damit Next.js den echten Client sieht:
# #   experimental: { trustHostHeader: true }
# # und in der App X-Forwarded-For auswerten, nicht die Socket-Adresse,
# # sonst steht im Audit-Log immer 127.0.0.1.
