<!doctype html>
<html lang="de-CH"><head><meta charset="utf-8"><title>IsoTeam Briefpapier Vordruck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
@page { size: A4; margin: 0; }

:root {
  --blau: #0A4A7C;
  --rot: #D0342A;
  --tinte: #131C24;
  --grau: #5D6B78;
  --linie: #DCE0E4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #E8EAEC;
  font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  color: var(--tinte);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.bogen {
  position: relative;
  width: 210mm;
  height: 297mm;
  margin: 10mm auto;
  padding: 16mm 20mm 12mm;
  background: #FFFFFF;
  box-shadow: 0 2px 14px rgba(0,0,0,0.14);
  overflow: hidden;
}

/* Falzmarken */
.bogen::before, .bogen::after {
  content: ""; position: absolute; left: 0; width: 4mm; height: 0;
  border-top: 0.2mm solid #C9D0D6;
}
.bogen::before { top: 105mm; }
.bogen::after  { top: 210mm; }

.kopf { display: flex; align-items: flex-start; justify-content: space-between; gap: 10mm; }
.logo { display: block; }
.kopf-adresse { text-align: right; font-size: 3.2mm; line-height: 1.45; color: var(--grau); }
.kopf-adresse strong { color: var(--tinte); font-weight: 600; }
.kopf-linie { height: 0.55mm; background: var(--blau); margin-top: 5mm; }
.leistungen {
  margin-top: 2.4mm; font-size: 2.6mm; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--grau);
}

/* Adressfeld fuer Couvert C5/C6 mit Fenster rechts */
.empfaenger {
  position: absolute; left: 115mm; top: 45mm; width: 80mm; height: 27.5mm;
  font-size: 3.4mm; line-height: 1.5;
}

.inhalt { position: absolute; left: 20mm; right: 20mm; top: 84mm; bottom: 26mm; }
.bogen.mit-qr .inhalt { bottom: 121mm; }

.meta { display: flex; gap: 14mm; font-size: 3.1mm; color: var(--grau); margin-bottom: 6mm; }
.meta strong { display: block; color: var(--tinte); font-weight: 600; }

h1.dok { font-family: 'Archivo', Arial, sans-serif; font-weight: 700; font-size: 6mm;
         letter-spacing: -0.01em; margin: 0 0 4mm; }
.betreff { font-weight: 600; font-size: 3.6mm; margin: 0 0 4mm; }
p { font-size: 3.4mm; line-height: 1.6; margin: 0 0 3.5mm; }

table.positionen { width: 100%; border-collapse: collapse; font-size: 3.1mm; }
table.positionen th {
  text-align: left; font-weight: 600; font-size: 2.7mm; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--grau);
  border-bottom: 0.4mm solid var(--blau); padding: 0 2mm 1.6mm 0;
}
table.positionen td { padding: 2.2mm 2mm 2.2mm 0; border-bottom: 0.2mm solid var(--linie); vertical-align: top; }
table.positionen .num { text-align: right; white-space: nowrap; }
table.positionen th.num { text-align: right; }
.detail { color: var(--grau); font-size: 2.8mm; }

table.summen { margin-left: auto; margin-top: 5mm; font-size: 3.2mm; border-collapse: collapse; }
table.summen td { padding: 1.4mm 0 1.4mm 10mm; text-align: left; }
table.summen .num { text-align: right; white-space: nowrap; }
table.summen tr.total td { font-weight: 700; border-top: 0.4mm solid var(--blau); padding-top: 2.2mm; }

.konditionen { margin-top: 6mm; font-size: 2.9mm; color: var(--grau); line-height: 1.6; }

.fuss {
  position: absolute; left: 20mm; right: 20mm; bottom: 12mm;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8mm;
  padding-top: 3mm; border-top: 0.2mm solid var(--linie);
  font-size: 2.8mm; line-height: 1.55; color: var(--grau);
}
.fuss strong { color: var(--tinte); font-weight: 600; }

/* Rapport */
table.rapport { width: 100%; border-collapse: collapse; font-size: 3.1mm; margin-bottom: 6mm; }
table.rapport th { text-align: left; font-size: 2.7mm; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--grau); font-weight: 600; border-bottom: 0.4mm solid var(--blau); padding: 0 2mm 1.6mm 0; }
table.rapport td { padding: 2.6mm 2mm 2.6mm 0; border-bottom: 0.2mm solid var(--linie); }
table.rapport .num { text-align: right; }
.unterschriften { display: grid; grid-template-columns: 1fr 1fr; gap: 16mm; margin-top: 14mm; }
.unterschrift { border-top: 0.2mm solid var(--tinte); padding-top: 1.6mm; font-size: 2.8mm; color: var(--grau); }

/* ---------- QR-Zahlteil, Schriften nach Vorgabe: Helvetica/Arial ---------- */
.qr-bereich {
  position: absolute; left: 0; right: 0; bottom: 0; height: 105mm;
  font-family: Helvetica, Arial, 'Liberation Sans', sans-serif; color: #000000;
}
.schere {
  position: absolute; top: -4.5mm; left: 0; right: 0; text-align: center;
  font-size: 2.3mm; color: #5D6B78; font-family: 'Barlow', Arial, sans-serif;
}
.qr-bereich::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0;
  border-top: 0.2mm dashed #000000;
}
.qr-raster { display: grid; grid-template-columns: 62mm 148mm; height: 105mm; }
.empfangsschein { padding: 5mm; border-right: 0.2mm dashed #000000; position: relative; }
.zahlteil { padding: 5mm; }
.qr-titel { font-size: 11pt; font-weight: 700; margin-bottom: 3mm; }
.qr-h6 { font-size: 6pt; font-weight: 700; line-height: 9pt; }
.qr-v8 { font-size: 8pt; line-height: 9pt; margin-bottom: 0; }
.qr-h8 { font-size: 8pt; font-weight: 700; line-height: 11pt; }
.qr-v10 { font-size: 10pt; line-height: 11pt; }
.abstand { margin-top: 2.5mm; }
.qr-block { margin-bottom: 3mm; }
.qr-betrag-zeile { display: flex; gap: 8mm; margin-top: 3mm; }
.qr-betrag-zeile.gross { gap: 10mm; margin-top: 5mm; }
.qr-annahme { position: absolute; right: 5mm; bottom: 5mm; font-size: 6pt; font-weight: 700; }
.zahlteil-spalten { display: grid; grid-template-columns: 51mm 87mm; gap: 5mm; }
.qr-code { width: 46mm; height: 46mm; margin: 5mm 0; }
.qr-code svg { width: 46mm; height: 46mm; display: block; }

@media print {
  body { background: #FFFFFF; }
  .bogen { margin: 0; box-shadow: none; page-break-after: always; }
  .bogen:last-child { page-break-after: auto; }
  .hinweis { display: none; }
}

.hinweis {
  max-width: 210mm; margin: 10mm auto 0; padding: 6mm 8mm;
  background: #FFFFFF; border-left: 1mm solid var(--blau);
  font-size: 3.2mm; line-height: 1.6; color: var(--tinte);
}
.hinweis h2 { font-family: 'Archivo', Arial, sans-serif; font-size: 4mm; margin: 0 0 2mm; }
.hinweis code { background: #F0F2F4; padding: 0.3mm 1mm; font-size: 2.9mm; }
.hinweis ul { margin: 2mm 0; padding-left: 5mm; }
.hinweis li { margin-bottom: 1.5mm; }

body { background: #FFFFFF; }
.bogen { margin: 0; box-shadow: none; }
</style></head>
